<style>
:root{
  color-scheme: light;
  --bg:#f2f4f8; --card:#ffffff; --card-2:#f6f8fb;
  --ink:#0b1220; --ink-2:#4b5565; --muted:#8a94a6; --line:#e7ebf1; --track:#edf0f5;
  --accent:#1652f0; --accent-soft:rgba(22,82,240,.10);
  --s1:#2a78d6; --s1-soft:#b7d3f6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --pos:#2a78d6; --neg:#e34948; --neg-soft:#f5c2c1;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-t:#0a7a0a; --bad-t:#c42f2f;
  --hdr-a:#1a5cff; --hdr-b:#0b3cc0;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);
  --radius:20px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b0f17; --card:#151b26; --card-2:#1b2230;
  --ink:#f3f6fb; --ink-2:#b4bdcc; --muted:#7d8799; --line:#232b39; --track:#202837;
  --accent:#6b9bff; --accent-soft:rgba(107,155,255,.14);
  --s1:#3987e5; --s1-soft:#2a4a78; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --pos:#3987e5; --neg:#e66767; --neg-soft:#5a2a2a;
  --good-t:#3cc43c; --bad-t:#f07a7a;
  --hdr-a:#1b3f9e; --hdr-b:#0c2466;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0b0f17; --card:#151b26; --card-2:#1b2230;
    --ink:#f3f6fb; --ink-2:#b4bdcc; --muted:#7d8799; --line:#232b39; --track:#202837;
    --accent:#6b9bff; --accent-soft:rgba(107,155,255,.14);
    --s1:#3987e5; --s1-soft:#2a4a78; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --pos:#3987e5; --neg:#e66767; --neg-soft:#5a2a2a;
    --good-t:#3cc43c; --bad-t:#f07a7a;
    --hdr-a:#1b3f9e; --hdr-b:#0c2466;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,select{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header ---------- */
.hdr{background:linear-gradient(160deg,var(--hdr-a) 0%,var(--hdr-b) 100%);color:#fff;padding:14px 16px 18px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hdr::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.brand .t1{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .t2{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel{position:relative;flex:none}
.msel select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:8px 30px 8px 13px;font-size:14px;font-weight:600;max-width:160px}
.msel select option{color:#0b1220}
.msel svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;opacity:.85}
.hbtn{width:38px;height:38px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.busy .hbtn svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{position:relative;z-index:1;margin-top:18px;min-height:104px}
.hero .lbl{font-size:13px;opacity:.8}
.hero .v{font-size:42px;font-weight:750;letter-spacing:-.03em;line-height:1.08;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hero .meta{font-size:13px;opacity:.85;margin-top:8px}
.hero .meta b{font-weight:650}
.hpill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650}
.hpill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.hpill.good i{background:#5ee08a} .hpill.bad i{background:#ff9b9b} .hpill.flat i{background:#dbe4ff}
.hpill span{font-weight:400;opacity:.8}

.chips{position:relative;z-index:1;display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips[hidden]{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:#fff;color:var(--hdr-b);border-color:#fff;font-weight:650}

.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s}
.busy .progress{opacity:1}
.progress::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:#7fb0ff;animation:prog 1.2s ease-in-out infinite}
@keyframes prog{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---------- content ---------- */
main{padding:14px 14px 104px;max-width:560px;margin:0 auto;transition:opacity .2s}
.busy main{opacity:.75}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid transparent}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .tile{border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .tile{border-color:var(--line)}}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.ch h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.ch small{color:var(--muted);font-size:12px}
.sectitle{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 10px}

.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.rise{animation:none}.bar,.tcol .b{transition:none!important}}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.tile{background:var(--card);border-radius:18px;padding:13px 13px 12px;box-shadow:var(--shadow);border:1px solid transparent;min-width:0}
.tile .th{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ic svg{width:17px;height:17px}
.ic.green{background:rgba(12,163,12,.12);color:var(--good-t)} .ic.red{background:rgba(208,59,59,.12);color:var(--bad-t)} .ic.orange{background:rgba(235,104,52,.13);color:#d0571f} .ic.teal{background:rgba(27,175,122,.13);color:#14936a}
.tile .lbl{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:21px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile .dl{margin-top:8px}
.tile .dl .vs{display:block;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:650;white-space:nowrap}
.pill.good{background:rgba(12,163,12,.11);color:var(--good-t)} .pill.bad{background:rgba(208,59,59,.11);color:var(--bad-t)} .pill.flat{background:var(--card-2);color:var(--ink-2)}
.vs{font-size:12px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px 2px 7px;border-radius:999px;color:var(--ink);background:var(--card-2);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.st.good i{background:var(--good)} .st.warn i{background:var(--warn)} .st.crit i{background:var(--crit)}

/* trend chart */
.seg{display:flex;background:var(--card-2);border-radius:12px;padding:3px;gap:2px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.tplot{position:relative;height:168px;display:flex;gap:10px;padding:0 2px}
.tzero{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.tcol{flex:1;position:relative;cursor:pointer;min-width:0}
.tcol .b{position:absolute;left:50%;transform:translateX(-50%);width:min(34px,70%);background:var(--s1-soft);transition:height .6s cubic-bezier(.2,.7,.2,1),bottom .6s cubic-bezier(.2,.7,.2,1)}
.tcol .b.p{border-radius:7px 7px 2px 2px}
.tcol .b.n{background:var(--neg-soft);border-radius:2px 2px 7px 7px}
.tcol.on .b.p{background:var(--s1)} .tcol.on .b.n{background:var(--neg)}
.tcol .b.miss{background:none;border:1.5px dashed var(--line);border-radius:7px}
.tcol .lv{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tcol.on .lv{color:var(--ink)}
.tx{display:flex;gap:10px;padding:8px 2px 0;border-top:1px solid var(--line);margin-top:2px}
.tx span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.tx span.on{color:var(--ink);font-weight:700}
.tnote{font-size:12px;color:var(--muted);margin-top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* P&L */
.pl{display:grid;grid-template-columns:1fr auto 54px}
.pl>div{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pl>div:nth-child(-n+3){border-top:0}
.pl>div:nth-child(3n+2){padding-left:10px}
.pl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl .p{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:10px}
.pl .sub{color:var(--ink-2);font-size:13px;padding-left:14px}
.pl .tot{font-weight:700}
.pl .grand{font-weight:800;font-size:15.5px}

/* bar lists */
.bl{list-style:none;margin:0;padding:0}
.bl li{padding:10px 0;border-top:1px solid var(--line)}
.bl li:first-child{border-top:0;padding-top:2px}
.bl .tr{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bl .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .val{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}
.bl .val small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.track{position:relative;height:8px;margin-top:7px;background:var(--track);border-radius:999px;overflow:hidden}
.bar{position:absolute;top:0;height:8px;background:var(--s1);border-radius:0 4px 4px 0;left:0;width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.track.div{background:none;overflow:visible}
.track.div::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:var(--track);border-radius:999px}
.track.div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--muted);opacity:.5}
.track.div .bar.p{left:50%;background:var(--pos)}
.track.div .bar.n{right:50%;left:auto;background:var(--neg);border-radius:4px 0 0 4px}
.bl li.tap{cursor:pointer}

/* stacked */
.stack{display:flex;gap:2px;height:12px;margin:2px 0 14px;border-radius:6px;overflow:hidden}
.stack span{display:block;height:100%;min-width:3px}
.legend{display:grid;gap:9px}
.legend .it{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .val{font-variant-numeric:tabular-nums;font-weight:650}
.legend .pc{color:var(--muted);font-size:12px;width:48px;text-align:right;font-variant-numeric:tabular-nums}

/* key-value */
.kv{display:grid;grid-template-columns:1fr auto}
.kv>div{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv>div:nth-child(-n+2){border-top:0}
.kv .k small{display:block;color:var(--muted);font-size:12px}
.kv .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.kv .r small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.kv .grp{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:14px}

/* insights */
.ins .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ins .it:first-child{border-top:0;padding-top:0}
.ins .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.ins .k{font-size:12px;color:var(--muted)}
.ins .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:550}
.ins .row .r{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}

/* branch cards */
.bc{cursor:pointer}
.bc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.bc .nm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px}
.bc .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card-2);border-radius:14px;padding:10px 12px}
.bc .g3 .k{font-size:11px;color:var(--muted)}
.bc .g3 .v{font-size:14.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.bc .ft .go{color:var(--accent);font-weight:600}

details.card summary{cursor:pointer;font-size:15px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
details.card[open] summary::after{content:"−"}
details.card[open] summary{margin-bottom:8px}

.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.banner{display:flex;gap:10px;align-items:flex-start;background:rgba(250,178,25,.13);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:13px;color:var(--ink)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:12px 0 4px;line-height:1.7}

/* states */
.center{display:grid;place-items:center;min-height:60vh;text-align:center;gap:14px;padding:24px}
.center h2{margin:0;font-size:20px}
.center p{margin:0;color:var(--ink-2);max-width:320px}
.bigic{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.bigic svg{width:30px;height:30px}
.idbox{font-size:22px;font-weight:800;letter-spacing:.02em;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 18px;font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:11px 20px;font-weight:650;cursor:pointer}
.sk{background:linear-gradient(90deg,var(--card-2) 0%,var(--line) 50%,var(--card-2) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:14px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.hsk{background:rgba(255,255,255,.18);border-radius:10px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:3px 0;font-size:10.5px;color:var(--muted);cursor:pointer}
.tabbar .tic{width:46px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar button.on .tic{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>

  /* ===== yordamchi ===== */
  function $(s) { return document.querySelector(s); }

  function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/[ʻʼ'`’‘"]/g, '').replace(/\s+/g, ' ').trim(); }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function sec(id) { return (state.data && state.data.sections && state.data.sections[id]) || { header: [], rows: [] }; }
  function row(id, label) {
    var L = norm(label), rows = sec(id).rows, i;
    for (i = 0; i < rows.length; i++) if (norm(rows[i].l) === L) return rows[i];
    for (i = 0; i < rows.length; i++) if (norm(rows[i].l).indexOf(L) === 0) return rows[i];

  }
  function col(id, raw) {

      .toLowerCase().replace(/(^|\s)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }) || String(raw);
  }
  function prettyText(t) { var s = String(t || ''); branches().forEach(function (b) { if (s.indexOf(b) >= 0) s = s.split(b).join(bname(b)); }); return s; }
  var NB = ' ';
  function grp(n) { return Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
  function money(n) { return isNum(n) ? (n < 0 ? '−' : '') + '$' + grp(n) : '—'; }
  function moneyS(n) { return isNum(n) ? (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + grp(n) : '—'; }
  function compact(n) {
    if (!isNum(n)) return '—';

    if (a >= 1e6) { v = a / 1e6; u = 'M'; } else if (a >= 1e3) { v = a / 1e3; u = 'K'; } else { return s + '$' + Math.round(a); }
    return s + '$' + (v >= 100 ? Math.round(v) : v.toFixed(1).replace('.', ',').replace(/,0$/, '')) + u;
  }
  function pct(p, d) {

  }
  function ratio(n) { return isNum(n) ? n.toFixed(2).replace('.', ',').replace('-', '−') : '—'; }
  var MONTHS_LC = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentyabr', 'oktyabr', 'noyabr', 'dekabr'];
  function prevName() {

    if (p && p.ym && /^01\./.test(p.start || '')) return MONTHS_LC[(Number(p.ym.split('-')[1]) + 10) % 12];
    var m = String(sec(4).header[2] || '').match(/\(([^)]+)\)/);

  }
  function vsPrev() { return prevName() + 'ga nisbatan'; }
  function dinfo(cur, prev, upGood) {

    var diff = cur - prev;
    return {
      cls: upGood == null ? 'flat' : ((diff > 0) === upGood ? 'good' : 'bad'),
      arrow: diff > 0 ? '▲' : '▼',

  /* ===== qismlar ===== */
  function tile(o) {

  }
  function card(title, body, right, extra) {

  }
  function hero(label, value, deltaHtml, meta) {

  }
  function barList(items, opt) {
    opt = opt || {};
    var fmt = opt.fmt || money;
    if (!items.length) return '<p class="note">Ma\'lumot yo\'q</p>';
    var diverging = items.some(function (i) { return i.value < 0; });
    var max = Math.max.apply(null, items.map(function (i) { return Math.abs(i.value) || 0; })) || 1;
    return '<ul class="bl">' + items.map(function (i) {
      var w = i.value ? Math.max(Math.abs(i.value) / max * (diverging ? 50 : 100), 1) : 0;
      var bar = diverging
        ? '<div class="track div"><div class="bar ' + (i.value < 0 ? 'n' : 'p') + '" data-w="' + w.toFixed(2) + '"></div></div>'

  /* ===== oylar dinamikasi ===== */
  function trendCard() {
    var tr = (state.data && state.data.trend) || [];
    if (!tr.length) return '';
    var b = state.br || null;
    var metrics = [{ k: 's', l: 'Sotuv' }, { k: 'n', l: 'Sof foyda' }, { k: 'e', l: 'Xarajat' }, b ? { k: 'k', l: 'Sklad' } : { k: 'c', l: 'Pul' }];
    if (!metrics.some(function (m) { return m.k === state.metric; })) state.metric = 's';
    var mk = state.metric;
    var pts = tr.map(function (t) {
      var s = t.sum, v = null;
      if (s) {
        if (mk === 'c') v = isNum(s.c) ? s.c : null;
        else if (s[mk]) {
          var idx = 0;
          if (b) { idx = -1; for (var i = 0; i < s.cols.length; i++) if (norm(s.cols[i]) === norm(b)) idx = i; }
          v = idx >= 0 && isNum(s[mk][idx]) ? s[mk][idx] : null;
        }
      }
      return { ym: t.ym, short: t.short, v: v };
    });
    var vals = pts.filter(function (p) { return isNum(p.v); }).map(function (p) { return p.v; });
    var maxP = Math.max(0, Math.max.apply(null, vals.concat([0]))), minN = Math.min(0, Math.min.apply(null, vals.concat([0])));
    var range = (maxP - minN) || 1, H = 168, padT = 22, padB = minN < 0 ? 22 : 4, U = H - padT - padB;
    var Z = padB + (-minN) / range * U;
    var curYm = state.data.period.ym;
    var cols = pts.map(function (p) {
      var on = p.ym === curYm ? ' on' : '';
      if (!isNum(p.v)) return '<div class="tcol' + on + '" data-ym="' + p.ym + '"><div class="b miss" style="bottom:' + Z + 'px;height:36px" data-h="36"></div><div class="lv" style="bottom:' + (Z + 40) + 'px">—</div></div>';
      var h = Math.max(Math.abs(p.v) / range * U, p.v ? 3 : 0);
      if (p.v >= 0) return '<div class="tcol' + on + '" data-ym="' + p.ym + '"><div class="b p" style="bottom:' + Z + 'px;height:0" data-h="' + h.toFixed(1) + '"></div><div class="lv" style="bottom:' + (Z + h + 5) + 'px">' + compact(p.v) + '</div></div>';
      return '<div class="tcol' + on + '" data-ym="' + p.ym + '"><div class="b n" style="bottom:' + Z + 'px;height:0" data-h="' + h.toFixed(1) + '" data-neg="1"></div><div class="lv" style="bottom:' + Math.max(Z - h - 18, 0) + 'px">' + compact(p.v) + '</div></div>';
    }).join('');

    var xs = '<div class="tx">' + pts.map(function (p) { return '<span class="' + (p.ym === curYm ? 'on' : '') + '">' + p.short + '</span>'; }).join('') + '</div>';
    var missing = pts.some(function (p) { return !isNum(p.v); });

  }

  /* Retail / Fin tech / Undiruv (Analitika 10-bo'lim) */

  function vOverview() {

    var lines = [

    ];

  function coefStatus(label, v) {

      ['tez likvidlik', function (x) { return x >= 1 ? 'good' : x >= 0.7 ? 'warn' : 'crit'; }],
      ['absolyut likvidlik', function (x) { return x >= 0.2 ? 'good' : x >= 0.1 ? 'warn' : 'crit'; }],
      ['majburiyatlar / aktivlar', function (x) { return x <= 0.6 ? 'good' : x <= 0.8 ? 'warn' : 'crit'; }]
    ];
    for (var i = 0; i < rules.length; i++) if (L.indexOf(rules[i][0]) === 0) {
      var k = rules[i][1](v);
      return status(k, k === 'good' ? 'Normada' : k === 'warn' ? "E'tibor" : 'Xavf');
    }
    return '';
  }

    return ratio(v);

  var toastT;
  function toast(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); if (ms) toastT = setTimeout(function () { t.classList.remove('show'); }, ms);
  }
  function setBusy(on, msg) {
    document.body.classList.toggle('busy', on);
    $('#month').disabled = on;
    if (on && msg) toast(msg); else if (!on) $('#toast').classList.remove('show');
  }

  function fetchData(ym, force, ok, fail) {
    if (gsr) {
      gsr.withSuccessHandler(function (s) { try { ok(JSON.parse(s)); } catch (e) { fail(e); } }).withFailureHandler(fail).getDashboard(KEY, ym || '', !!force);
      return;
    }
    if (!inTG && !KEY) { ok({ ok: false, code: 'no_auth' }); return; }
    var q = '?action=data&ym=' + encodeURIComponent(ym || '') + (force ? '&force=1' : '') +
      (inTG ? '&tg=' + encodeURIComponent(tg.initData) : '&key=' + encodeURIComponent(KEY));
    var tries = 0;
    (function go() {
      tries++;
      // Qayta urinishda force olib tashlanadi: server birinchi so'rovda hisoblab saqlab qo'ygan bo'ladi
      var url = API_URL + (tries > 1 ? q.replace('&force=1', '') : q);
      fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(ok).catch(function (err) {
        if (tries < 6) setTimeout(go, 1500 * tries); else fail(err);
      });
    })();
  }
  function dkey(ym) { return 'data:' + (ym || 'cur'); }
  function dget(ym) { try { var v = localStorage.getItem('axd:' + dkey(ym)); if (!v) return null; var o = JSON.parse(v); return Date.now() - (o.__t || 0) < 7 * 864e5 ? o : null; } catch (e) { return null; } }
  function dset(ym, d) { try { d.__t = Date.now(); localStorage.setItem('axd:' + dkey(ym), JSON.stringify(d)); } catch (e) {} }
  function load(ym, force) {
    if (state.loading) return;
    state.loading = true;
    // Avval telefondagi oxirgi nusxani darhol ko'rsatamiz, keyin serverdan yangisini olamiz
    if (!force) {
      var cached = dget(ym);
      if (cached && cached.sections) {
        state.data = cached;
        if (state.br && branches().indexOf(state.br) < 0) state.br = '';
        render(false);
      }
    }
    var lbl = ym && state.data ? (state.data.months.filter(function (m) { return m.ym === ym; })[0] || {}).label : '';
    setBusy(true, lbl ? lbl + ' yuklanmoqda…' : (state.data ? 'Yangilanmoqda…' : ''));
    fetchData(ym, force, function (d) {
      state.loading = false;
      setBusy(false);
      if (!d || d.ok === false) {
        if (state.data && d && d.code === 'error') { render(false); toast('Xatolik: ' + (d.message || ''), 4000); return; }
        denied(d || {});
        return;
      }
      state.data = d;
      dset(ym, d);
      if (!ym && d.period) dset(d.period.ym, d);
      if (state.br && branches().indexOf(state.br) < 0) state.br = '';
      render(false);
      if (force) toast('Yangilandi', 1500);
    }, fail);
  }
  function fail(err) {
    state.loading = false; setBusy(false);
    var msg = (err && err.message) || String(err);
    if (state.data) { render(false); toast('Xatolik: ' + msg, 4000); }
    else $('#main').innerHTML = errorBox('Ma\'lumotni yuklab bo\'lmadi: ' + msg);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-br],[data-goto],[data-retry],[data-metric],[data-copy],.tcol[data-ym],#refresh');
    if (!t) return;
    if (t.id === 'refresh') { load(state.data ? state.data.period.ym : INIT_YM, true); return; }
    if (t.hasAttribute('data-retry')) { load(state.data ? state.data.period.ym : INIT_YM, true); return; }
    if (t.hasAttribute('data-copy')) {
      var v = t.getAttribute('data-copy');
      try { navigator.clipboard.writeText(v).then(function () { toast('Nusxalandi', 1500); }); } catch (er) { toast(v, 3000); }
      return;
    }
    if (t.hasAttribute('data-metric')) { state.metric = t.getAttribute('data-metric'); LS.set('metric', state.metric); haptic(); render(false); return; }
    if (t.classList.contains('tcol')) { var ym = t.getAttribute('data-ym'); if (state.data && ym !== state.data.period.ym) { haptic(); load(ym, false); } return; }
    if (t.hasAttribute('data-tab')) { state.tab = t.getAttribute('data-tab'); LS.set('tab', state.tab); haptic(); render(true); return; }
    if (t.hasAttribute('data-br')) { state.br = t.getAttribute('data-br'); LS.set('br', state.br); haptic(); render(false); return; }
    if (t.hasAttribute('data-goto')) { state.br = t.getAttribute('data-goto'); state.tab = 'umumiy'; LS.set('br', state.br); LS.set('tab', state.tab); haptic(); render(true); }
  });
  $('#month').addEventListener('change', function (e) { haptic(); load(e.target.value, false); });

  renderTabbar();
  load(INIT_YM, false);
})();
</script>
</body>
</html>
